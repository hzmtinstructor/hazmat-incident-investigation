<style>
*{box-sizing:border-box} body{margin:0;background:#eef2f6;font-family:Arial,Helvetica,sans-serif;color:#17212b}
.header{background:#073b63;color:#fff;padding:16px 24px;border-bottom:4px solid #d62828}
.header h1{margin:0;font-size:28px} .header p{margin:3px 0 0;font-size:16px}
.wrap{max-width:1120px;margin:20px auto;padding:0 14px} .card{background:#fff;border-radius:12px;box-shadow:0 3px 14px #0002;overflow:hidden}
.incident{display:block;width:100%;max-height:480px;object-fit:contain;background:#111}
.content{padding:24px} .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.badge{background:#073b63;color:#fff;padding:8px 13px;border-radius:7px;font-weight:700}
.bar{height:8px;background:#dfe5eb;border-radius:9px;overflow:hidden;margin-bottom:20px}
.fill{height:100%;background:#1672c4;width:11.11%}
h2{margin:6px 0 10px;color:#073b63;font-size:26px} .q{font-size:19px;line-height:1.45;margin-bottom:18px}
.photoRow{display:flex;gap:12px;margin:0 0 20px} .photo{flex:1;min-width:0}
.photo img{width:100%;height:145px;object-fit:cover;border-radius:8px;border:1px solid #ccd5dd}
.caption{font-size:12px;color:#5c6975;margin-top:4px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid #cbd5df;border-radius:9px;padding:13px 15px;margin:8px 0;font-size:16px;cursor:pointer}
.opt:hover{border-color:#1672c4;background:#f3f8fc} .opt:disabled{cursor:default}
.opt.correct{border-color:#1f9d55;background:#eaf8f0} .opt.wrong{border-color:#d62828;background:#fff0f0}
.let{display:inline-flex;width:32px;height:32px;align-items:center;justify-content:center;border-radius:6px;background:#073b63;color:#fff;font-weight:bold;margin-right:10px}
.fb{display:none;padding:13px;margin-top:13px;border-radius:8px;line-height:1.4} .fb.show{display:block}
.good{background:#eaf8f0;border-left:5px solid #1f9d55} .bad{background:#fff0f0;border-left:5px solid #d62828}
.controls{display:flex;justify-content:space-between;margin-top:20px} .nav{border:0;border-radius:8px;padding:11px 20px;background:#1672c4;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}
.nav:disabled{background:#aeb8c2;cursor:not-allowed} #results{display:none;padding:34px;text-align:center}
.review{text-align:left;margin-top:20px} .review div{padding:10px;border-bottom:1px solid #ddd}
@media(max-width:700px){.photoRow{flex-direction:column}.photo img{height:180px}}
</style></head>

<script>
const stages=[{"title": "Initial Size-Up", "text": "You are the first-due officer on scene of a reported leaking tanker trailer. Based on the incident photo, what is your first priority?", "options": ["Immediately approach the tanker to identify the leak.", "Stop at a safe distance and perform a size-up of the situation.", "Send firefighters to investigate the leak.", "Have the driver open the compartment to determine the product."], "correct": 1, "feedback": "Begin with a safe approach and scene size-up."}, {"title": "Spill Assessment", "text": "You can see liquid escaping and collecting on the pavement. What should you determine during the initial assessment?", "options": ["How quickly a firefighter can plug the leak.", "Whether civilians can approach the tanker.", "Whether the spill is small or large and what initial control methods are needed.", "Whether the tanker should immediately be driven away."], "correct": 2, "feedback": "Determine the size of the spill and the initial control methods."}, {"title": "Container Identification", "text": "The incident involves a DOT 407 / MC-406 cargo tank. What products are typically associated with this type of container?", "options": ["Gasoline, diesel, ethanol, and other Class 3 flammable/combustible liquids.", "Compressed oxygen and chlorine gas.", "Radioactive materials only.", "Cryogenic gases only."], "correct": 0, "feedback": "The PowerPoint identifies gasoline, diesel, ethanol, and other Class 3 liquids."}, {"title": "Product Identification", "text": "The product has not yet been positively confirmed. What information should you use to identify it?", "options": ["The color of the liquid alone.", "A firefighter's experience with fuel.", "Opening the tank to inspect the product.", "Placards, markings, shipping papers, and driver/operator confirmation from a safe distance."], "correct": 3, "feedback": "Use available identification information without unnecessarily entering the hazard area."}, {"title": "Hazard Assessment", "text": "What hazards should be considered as the liquid forms a pool beneath the tanker?", "options": ["Only the appearance of the liquid.", "Only traffic congestion.", "Vapor movement, ignition sources, drains or waterways, and nearby exposures.", "Only roadway damage."], "correct": 2, "feedback": "Consider vapor movement, ignition sources, drains/waterways, and nearby exposures."}, {"title": "Initial Protective Actions", "text": "What initial protective action is appropriate?", "options": ["Establish hot, warm, and cold zones and deny entry to bystanders and unprotected responders.", "Allow traffic to continue through the spill.", "Send unprotected personnel into the leak area.", "Place the command post beside the tanker."], "correct": 0, "feedback": "Establish isolation zones and deny entry to unprotected people."}, {"title": "Ignition Control", "text": "If the product is a flammable liquid, what is a critical priority?", "options": ["Use road flares to mark the spill.", "Eliminate ignition sources and control traffic.", "Allow smoking outside the immediate spill area.", "Start the tanker engine to move it."], "correct": 1, "feedback": "Ignition control is a very high priority for a flammable-liquid spill."}, {"title": "Operations-Level Spill Control", "text": "You are operating at the Operations level and the leak continues. Which defensive action is appropriate?", "options": ["Climb onto the tanker and plug the leak.", "Operate manway lids and valves to stop the leak.", "Enter the flammable atmosphere without appropriate PPE and monitoring.", "Dike, dam, or divert the product and protect storm drains or waterways."], "correct": 3, "feedback": "Operations-level actions are defensive: dike, dam, divert, and protect drains/waterways."}, {"title": "Command & Notifications", "text": "Multiple agencies and HazMat resources are involved. What command and notification actions should be considered?", "options": ["Allow the driver to manage the incident independently.", "Notify no outside agencies until the leak stops.", "Unified Command and appropriate notifications to emergency management, transportation, environmental agencies, and the shipper.", "End incident command once the spill is contained."], "correct": 2, "feedback": "The scenario calls for coordinated command and appropriate outside-agency notifications."}];
let cur=0,score=0,answers=Array(stages.length).fill(null);
const $=id=>document.getElementById(id);
function render(){
 const s=stages[cur]; $('badge').textContent=`Scenario ${cur+1} of ${stages.length}`;
 $('fill').style.width=((cur+1)/stages.length*100)+'%'; $('title').textContent=s.title; $('q').textContent=s.text; $('opts').innerHTML='';
 $('fb').className='fb'; $('fb').textContent=''; $('next').disabled=answers[cur]===null; $('prev').disabled=cur===0;
 s.options.forEach((o,i)=>{let b=document.createElement('button');b.className='opt';b.innerHTML=`<span class="let">${String.fromCharCode(65+i)}</span>${o}`;
 b.onclick=()=>choose(i); if(answers[cur]!==null){b.disabled=true;if(i===s.correct)b.classList.add('correct');if(i===answers[cur]&&i!==s.correct)b.classList.add('wrong')}$('opts').appendChild(b)});
 if(answers[cur]!==null){let ok=answers[cur]===s.correct;$('fb').className='fb show '+(ok?'good':'bad');$('fb').textContent=(ok?'Correct. ':'Review. ')+s.feedback.replace(/^Correct\. /,'')}
 $('score').textContent=score;
}
function choose(i){if(answers[cur]!==null)return;answers[cur]=i;if(i===stages[cur].correct)score++;render()}
$('next').onclick=()=>{if(cur<stages.length-1){cur++;render()}else showResults()};
$('prev').onclick=()=>{if(cur>0){cur--;render()}};
function showResults(){$('activity').style.display='none';$('results').style.display='block';let pct=Math.round(score/stages.length*100);
$('final').innerHTML=`You answered <strong>${score} of ${stages.length}</strong> correctly (${pct}%).`;
$('review').innerHTML=stages.map((s,i)=>`<div><strong>${i+1}. ${s.title}</strong> — ${answers[i]===s.correct?'Correct':'Review'}<br>Correct answer: ${String.fromCharCode(65+s.correct)}. ${s.options[s.correct]}</div>`).join('')}
render();
</script></body></html>
